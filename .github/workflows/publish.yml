name: Publish plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          npm install -g prettier
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools || \
          sudo apt-get install -y --no-install-recommends qml6format

      - name: Format
        run: |
          prettier --write "**/*.{js,json,md}"
          find . -name "*.qml" ! -path './.git/*' -exec /usr/lib/qt6/bin/qmlformat -i {} +
          find . -name "*~" -delete

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

  publish:
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish plugins to their own repos
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_ACTOR: github-actions[bot]
        run: bash scripts/publish.sh
