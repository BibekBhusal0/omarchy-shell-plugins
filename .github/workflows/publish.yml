name: Publish plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install tools
        run: |
          bun add --global prettier
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools || \
          sudo apt-get install -y --no-install-recommends qml6format

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Render banners
        run: |
          sudo apt-get install -y fonts-jetbrains-mono
          printf '#!/bin/sh\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "${{ steps.setup-chrome.outputs.chrome-path }}" > /tmp/chrome-wrap.sh
          chmod +x /tmp/chrome-wrap.sh
          cd banners && BUN_CHROME_PATH=/tmp/chrome-wrap.sh bun screenshot.ts

      - name: Format
        run: |
          prettier --write "**/*.{js,json,md}"
          find . -name "*.qml" ! -path './.git/*' -exec /usr/lib/qt6/bin/qmlformat -i {} +
          find . -name "*~" -delete

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git commit -m "style: auto-format code"
          git pull --rebase origin main
          git push origin HEAD:main

  publish:
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish plugins to their own repos
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_ACTOR: github-actions[bot]
        run: bash scripts/publish.sh

      - name: Commit cleared release notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*/release notes.md'
          if git diff --cached --quiet; then
            echo "No release notes to clear."
            exit 0
          fi
          git commit -m "chore: clear release notes after publish [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
